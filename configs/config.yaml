# Master Engine Configuration
version: "1.0"

project:
  name: "competitive-velocity-ml-engine"
  description: "Competitive Content Velocity & Drift Engine on Live YouTube Stream"

ingest:
  mode: "synthetic"  # 'synthetic' or 'live'
  channels_file: "configs/channels_registry.yaml"
  output_dir: "data/raw"
  lookback_days: 180
  seed: 42
  channels_count: 30

feature_store:
  db_path: "data/feature_store.duckdb"
  profiles_dir: "dbt_feature_store"
  target_schema: "main"
  rolling_window_days: 30
  blitz_window_hours: 24

training:
  holdout_fraction: 0.15
  n_splits: 5
  random_state: 42
  precision_floor: 0.70
  text_svd_components: 16

monitoring:
  psi_alert_threshold: 0.20
  realized_window_days: 7
