name: CI Verification Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    name: Run Pytest & 13-Stage Pipeline Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install project dependencies
        run: |
          uv sync --all-extras

      - name: Run Pytest Suite (45 Tests)
        run: |
          uv run pytest tests/

      - name: Run Master 13-Stage E2E Verification
        run: |
          uv run python scripts/verify_pipeline.py
