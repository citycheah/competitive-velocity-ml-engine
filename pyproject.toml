[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "competitive-velocity-ml-engine"
version = "0.1.0"
description = "Competitive Content Velocity & Drift Engine for Live Public Media Streams"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cheah Chuen Thong"}
]
keywords = ["machine-learning", "feature-store", "youtube", "velocity", "drift", "dbt", "duckdb", "streamlit"]
dependencies = [
    "duckdb>=1.0.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "google-api-python-client>=2.100.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "pyarrow>=15.0.0",
    "click>=8.1.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "altair>=5.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0"
]

[project.scripts]
competitive-ingest = "src.ingest.cli:main"
verify-pipeline = "scripts.verify_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:shap.*",
    "ignore::UserWarning:lightgbm.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
